apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: push-fight
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow App to access Ollama
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-ollama
  namespace: push-fight
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: push-fight-app
    ports:
    - protocol: TCP
      port: 11434
---
# Allow App to access ChromaDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-chromadb
  namespace: push-fight
spec:
  podSelector:
    matchLabels:
      app: chromadb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: push-fight-app
    ports:
    - protocol: TCP
      port: 8000
---
# Allow App Egress (DNS + Ollama + ChromaDB)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress
  namespace: push-fight
spec:
  podSelector:
    matchLabels:
      app: push-fight-app
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow traffic to Ollama
  - to:
    - podSelector:
        matchLabels:
          app: ollama
    ports:
    - protocol: TCP
      port: 11434
  # Allow traffic to ChromaDB
  - to:
    - podSelector:
        matchLabels:
          app: chromadb
    ports:
    - protocol: TCP
      port: 8000
