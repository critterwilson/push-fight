apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: push-fight
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow App Egress (DNS only - no external services needed for RL training)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress
  namespace: push-fight
spec:
  podSelector:
    matchLabels:
      app: push-fight-app
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
