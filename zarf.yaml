kind: ZarfPackageConfig
metadata:
  name: push-fight-app
  description: "Push Fight board game with RL training and RAG referee, deployed via UDS"
  version: "0.0.1"

components:
  - name: push-fight-app
    required: true
    manifests:
      - name: k8s-resources
        noWait: true
        files:
          - deployment.yaml
          - uds-package.yaml
    images:
      - "push-fight-app:latest"
      - "chromadb/chroma:latest"
      - "ollama/ollama:latest"
    dataInjections:
      - source: ollama-models
        target:
          namespace: push-fight
          selector: app=ollama
          container: ollama
          path: /root/.ollama/models
        compress: true
    actions:
      onDeploy:
        defaults:
          maxTotalSeconds: 600
        after:
          - wait:
              cluster:
                kind: deployment
                name: chromadb
                namespace: push-fight
                condition: available
          - wait:
              cluster:
                kind: deployment
                name: ollama
                namespace: push-fight
                condition: available
          - wait:
              cluster:
                kind: deployment
                name: push-fight-app
                namespace: push-fight
                condition: available
